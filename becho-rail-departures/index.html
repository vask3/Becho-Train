<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Berlin Hbf — Табло за департури</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #0a0e27;
      color: #e0e0e0;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    /* --- Header --- */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .header h1 {
      font-size: 1.8rem;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header h1 .icon { font-size: 1.5rem; }

    .station-name {
      color: #6c8eff;
      font-weight: 500;
    }

    .source-badge {
      background: #1a2247;
      border: 1px solid #2a3260;
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 0.8rem;
      color: #8b9dc3;
    }

    .source-badge.live {
      background: #0d3b1a;
      border-color: #1a6b35;
      color: #4ade80;
    }

    .source-badge.mock {
      background: #3b1a0d;
      border-color: #6b351a;
      color: #f59e0b;
    }

    /* --- Controls --- */
    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .controls input {
      flex: 1;
      min-width: 150px;
      padding: 10px 14px;
      border: 1px solid #2a3260;
      border-radius: 8px;
      background: #141b3a;
      color: #fff;
      font-size: 0.95rem;
    }

    .controls input:focus {
      outline: none;
      border-color: #6c8eff;
    }

    .controls button {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      background: #6c8eff;
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .controls button:hover { background: #8aa3ff; }
    .controls button:disabled { background: #333; cursor: not-allowed; }

    /* --- Stats --- */
    .stats {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .stat {
      background: #141b3a;
      border: 1px solid #1e2850;
      border-radius: 10px;
      padding: 12px 18px;
      text-align: center;
      flex: 1;
      min-width: 90px;
    }

    .stat .num { font-size: 1.5rem; font-weight: 700; color: #fff; }
    .stat .label { font-size: 0.75rem; color: #8b9dc3; margin-top: 2px; }
    .stat.on-time .num { color: #4ade80; }
    .stat.delayed .num { color: #f59e0b; }
    .stat.cancelled .num { color: #ef4444; }
    .stat.early .num { color: #38bdf8; }

    /* --- Departure list --- */
    .departures { display: flex; flex-direction: column; gap: 8px; }

    .departure {
      display: grid;
      grid-template-columns: 70px 80px 1fr 70px 80px;
      align-items: center;
      gap: 12px;
      background: #141b3a;
      border: 1px solid #1e2850;
      border-radius: 10px;
      padding: 14px 16px;
      transition: border-color 0.2s;
    }

    .departure:hover { border-color: #2a3260; }

    .departure.cancelled { opacity: 0.5; }

    .dep-time {
      font-size: 1.15rem;
      font-weight: 700;
      color: #fff;
      text-align: center;
    }

    .dep-time .delay {
      font-size: 0.75rem;
      font-weight: 500;
      display: block;
      margin-top: 2px;
    }

    .dep-time .delay.late { color: #f59e0b; }
    .dep-time .delay.early { color: #38bdf8; }

    .dep-line {
      text-align: center;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 6px 10px;
      border-radius: 6px;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Line type colors */
    .dep-line.suburban { background: #00843d; }
    .dep-line.subway { background: #0066b3; }
    .dep-line.tram { background: #d63a3a; }
    .dep-line.bus { background: #a30084; }
    .dep-line.regional, .dep-line.nationalExpress, .dep-line.national { background: #444; }
    .dep-line.express { background: #e60012; }

    .dep-destination {
      font-size: 0.95rem;
      color: #d0d0d0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .dep-platform {
      font-size: 0.85rem;
      color: #8b9dc3;
      text-align: center;
    }

    .dep-status {
      text-align: center;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 6px;
    }

    .dep-status.on-time { background: #0d3b1a; color: #4ade80; }
    .dep-status.delayed { background: #3b2a0d; color: #f59e0b; }
    .dep-status.cancelled { background: #3b0d0d; color: #ef4444; }
    .dep-status.early { background: #0d2a3b; color: #38bdf8; }

    /* --- Loading / Error --- */
    .loading, .error {
      text-align: center;
      padding: 40px;
      color: #8b9dc3;
      font-size: 1.1rem;
    }

    .error { color: #ef4444; }

    .spinner {
      display: inline-block;
      width: 32px;
      height: 32px;
      border: 3px solid #2a3260;
      border-top-color: #6c8eff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 12px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .fetched-at {
      text-align: center;
      margin-top: 20px;
      font-size: 0.8rem;
      color: #555;
    }

    /* --- Responsive --- */
    @media (max-width: 600px) {
      .departure {
        grid-template-columns: 60px 70px 1fr 60px;
      }
      .dep-status { display: none; }
      .header h1 { font-size: 1.4rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <h1>
        <span class="icon">🚉</span>
        <span class="station-name" id="stationName">Berlin Hbf</span>
      </h1>
      <span class="source-badge" id="sourceBadge">—</span>
    </div>

    <!-- Controls -->
    <div class="controls">
      <input type="text" id="stationInput" value="8011160" placeholder="Station ID (напр. 8011160)">
      <button id="fetchBtn" onclick="fetchDepartures()">Обнови</button>
      <button onclick="fetchDepartures(true)" style="background:#2a3260">Debug</button>
    </div>

    <!-- Stats -->
    <div class="stats" id="stats" style="display:none">
      <div class="stat"><div class="num" id="statTotal">0</div><div class="label">Общо</div></div>
      <div class="stat on-time"><div class="num" id="statOnTime">0</div><div class="label">На време</div></div>
      <div class="stat delayed"><div class="num" id="statDelayed">0</div><div class="label">Забавени</div></div>
      <div class="stat cancelled"><div class="num" id="statCancelled">0</div><div class="label">Отменени</div></div>
      <div class="stat early"><div class="num" id="statEarly">0</div><div class="label">Подранили</div></div>
    </div>

    <!-- Departures -->
    <div id="departures">
      <div class="loading">
        <div class="spinner"></div>
        <div>Зареждане на департурите...</div>
      </div>
    </div>

    <div class="fetched-at" id="fetchedAt"></div>
  </div>

  <script>
    const WORKER_URL = "https://becho-rail-proxy.grackiglas.workers.dev";

    function formatDelay(delay) {
      if (delay == null) return "";
      if (delay === 0) return "";
      const mins = Math.abs(delay);
      const sign = delay > 0 ? "+" : "−";
      if (mins >= 60) {
        const h = Math.floor(mins / 60);
        const m = mins % 60;
        return sign + h + "h" + (m > 0 ? " " + m + "m" : "");
      }
      return sign + mins + " мин";
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text || "";
      return div.innerHTML;
    }

    async function fetchDepartures(debug = false) {
      const stationId = document.getElementById("stationInput").value.trim();
      if (!stationId) return;

      const btn = document.getElementById("fetchBtn");
      btn.disabled = true;
      btn.textContent = "Зареждане...";

      const container = document.getElementById("departures");
      container.innerHTML = '<div class="loading"><div class="spinner"></div><div>Зареждане на департурите...</div></div>';
      document.getElementById("stats").style.display = "none";

      try {
        const url = WORKER_URL + "?id=" + encodeURIComponent(stationId) + (debug ? "&debug=1" : "");
        const resp = await fetch(url);
        const data = await resp.json();

        // Update station name
        document.getElementById("stationName").textContent = data.station?.name || "Unknown";

        // Update source badge
        const badge = document.getElementById("sourceBadge");
        badge.textContent = data.source || "unknown";
        badge.className = "source-badge " + (data.source === "mock-fallback" ? "mock" : "live");

        // Update stats
        const deps = data.departures || [];
        const onTime = deps.filter(d => d.status === "on-time").length;
        const delayed = deps.filter(d => d.status === "delayed").length;
        const cancelled = deps.filter(d => d.status === "cancelled").length;
        const early = deps.filter(d => d.status === "early").length;

        document.getElementById("statTotal").textContent = deps.length;
        document.getElementById("statOnTime").textContent = onTime;
        document.getElementById("statDelayed").textContent = delayed;
        document.getElementById("statCancelled").textContent = cancelled;
        document.getElementById("statEarly").textContent = early;
        document.getElementById("stats").style.display = "flex";

        // Render departures
        if (deps.length === 0) {
          container.innerHTML = '<div class="loading">Няма намерени департури.</div>';
        } else {
          container.innerHTML = '<div class="departures">' + deps.map(d => {
            const delayText = formatDelay(d.delay);
            const delayClass = d.delay > 0 ? "late" : (d.delay < 0 ? "early" : "");
            const lineTypeClass = d.lineType || "";
            return `
              <div class="departure ${d.cancelled ? "cancelled" : ""}">
                <div class="dep-time">
                  ${escapeHtml(d.time)}
                  ${delayText ? `<span class="delay ${delayClass}">${delayText}</span>` : ""}
                </div>
                <div class="dep-line ${lineTypeClass}" title="${escapeHtml(d.lineType)}">${escapeHtml(d.line)}</div>
                <div class="dep-destination">${escapeHtml(d.destination)}</div>
                <div class="dep-platform">${d.platform ? escapeHtml(d.platform) : "—"}</div>
                <div class="dep-status ${d.status}">${
                  d.status === "on-time" ? "на време" :
                  d.status === "delayed" ? "забавен" :
                  d.status === "cancelled" ? "отменен" :
                  d.status === "early" ? "подранил" : d.status
                }</div>
              </div>`;
          }).join("") + "</div>";
        }

        // Fetched time
        document.getElementById("fetchedAt").textContent =
          "Обновено: " + new Date(data.fetchedAt || Date.now()).toLocaleString("bg-BG");

      } catch (err) {
        container.innerHTML = '<div class="error">Грешка при зареждане: ' + escapeHtml(err.message) + "</div>";
      } finally {
        btn.disabled = false;
        btn.textContent = "Обнови";
      }
    }

    // Auto-fetch on load
    fetchDepartures();
  </script>
</body>
</html>
