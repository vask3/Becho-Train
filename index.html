<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <title>BVG Трафик</title>
    <style>
        body { font-family: sans-serif; background: #000; color: #ff0; padding: 20px; }
        .item { border-bottom: 1px solid #333; padding: 8px 0; }
    </style>
</head>
<body>

    <h2>BVG На живо (Alexanderplatz)</h2>
    <div id="board">Зареждане...</div>

    <script>
        async function loadBVG() {
            try {
                // Използва публичното VBB/BVG API за спирка Alexanderplatz (ID: 900100003)
                const res = await fetch('https://v6.bvg.transport.rest/stops/900100003/departures?duration=15');
                const data = await res.json();
                
                let html = '';
                data.departures.forEach(d => {
                    let when = new Date(d.when || d.plannedWhen).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                    html += `<div class="item"><b>${d.line.name}</b> към ${d.direction} — <b>${when}</b></div>`;
                });
                
                document.getElementById('board').innerHTML = html || 'Няма налични курсове.';
            } catch (e) {
                document.getElementById('board').innerHTML = 'Грешка при зареждане на данните.';
            }
        }
        
        loadBVG();
        setInterval(loadBVG, 30000); // Опреснява на всеки 30 секунди
    </script>

</body>
</html>
